name: Node.js Express CI

on:
  push:
    branches:
      - main

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify the app starts successfully
        run: |
          export ENV=DEV
          export PORT=8080
          npm start > app.log 2>&1 &
          APP_PID=$!

          for i in {1..20}; do
            if curl -sSf http://127.0.0.1:8080/ > /dev/null; then
              echo "Application started successfully"
              kill $APP_PID
              wait $APP_PID || true
              exit 0
            fi
            sleep 2
          done

          echo "Application failed to start"
          kill $APP_PID || true
          cat app.log
          exit 1
