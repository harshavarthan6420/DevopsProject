name: Node.js Express CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-1
  S3_BUCKET: devops-project-deploy-2026
  EC2_INSTANCE_ID: i-080146b2db0eca75f
  APP_DIR: /home/ubuntu/simple-application

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify the app starts successfully
        run: |
          export ENV=DEV
          export PORT=8080
          export HOST=127.0.0.1

          npm start > app.log 2>&1 &
          APP_PID=$!

          for i in {1..20}; do
            if curl -sSf http://127.0.0.1:8080/ > /dev/null; then
              echo "Application started successfully"
              kill $APP_PID
              wait $APP_PID || true
              exit 0
            fi
            sleep 2
          done

          echo "Application failed to start"
          kill $APP_PID || true
          cat app.log
          exit 1

  deploy:
    needs: build-and-verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create deployment package
        run: |
          rm -f deploy.tar.gz
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='app.log' \
            --exclude='*.log' \
            --exclude='deploy.tar.gz' \
            -czf /tmp/deploy.tar.gz .
          cp /tmp/deploy.tar.gz ./deploy.tar.gz

      - name: Upload deployment package to private S3
        run: |
          aws s3 cp deploy.tar.gz \
            "s3://${S3_BUCKET}/releases/${GITHUB_SHA}.tar.gz"

      - name: Deploy through AWS Systems Manager
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --comment "Deploy ${GITHUB_SHA}" \
            --parameters commands="[
              \"set -e\",
              \"mkdir -p /tmp/devops-deploy\",
              \"aws s3 cp s3://${S3_BUCKET}/releases/${GITHUB_SHA}.tar.gz /tmp/devops-deploy/deploy.tar.gz\",
              \"mkdir -p ${APP_DIR}\",
              \"tar -xzf /tmp/devops-deploy/deploy.tar.gz -C ${APP_DIR}\",
              \"cd ${APP_DIR}\",
              \"npm ci\",
              \"if ./node_modules/.bin/pm2 describe simple-application > /dev/null 2>&1; then ./node_modules/.bin/pm2 restart simple-application --update-env; else ./node_modules/.bin/pm2 start ecosystem.config.js --update-env; fi\",
              \"./node_modules/.bin/pm2 save\",
              \"for i in \\$(seq 1 15); do if curl -sSf http://127.0.0.1:8080/ > /dev/null; then echo 'Health check passed'; exit 0; fi; sleep 2; done\",
              \"echo 'Health check failed after 30 seconds'\",
              \"./node_modules/.bin/pm2 status\",
              \"./node_modules/.bin/pm2 logs simple-application --lines 30 --nostream\",
              \"exit 1\"
            ]" \
            --output text \
            --query 'Command.CommandId')

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "SSM status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully"
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac

            sleep 2
          done

          echo "Timed out waiting for SSM command"
          exit 1